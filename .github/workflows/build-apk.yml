name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and find app folder
        id: app
        run: |
          mkdir -p extracted
          find . -maxdepth 2 -iname '*.zip' -not -path './extracted/*' | while read -r z; do
            echo "Unzipping $z"
            unzip -o -q "$z" -d extracted
          done
          PKG=$(find extracted . -maxdepth 4 -name package.json -not -path '*/node_modules/*' \
                  -exec grep -l '"expo-router/entry"' {} \; | head -n 1)
          if [ -z "$PKG" ]; then
            echo "::error::No Expo app found"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          echo "App folder: $(dirname "$PKG")"
          echo "dir=$(dirname "$PKG")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm install

      - name: Generate native Android project
        working-directory: ${{ steps.app.outputs.dir }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: ${{ steps.app.outputs.dir }}/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: majesto-apk
          path: ${{ steps.app.outputs.dir }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
